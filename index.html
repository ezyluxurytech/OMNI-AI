<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omni — Next-Generation AI Assistant</title>
    <meta name="description" content="Omni: A futuristic, intelligent AI assistant featuring starlight sparkle explosions, hyperspace galaxy introduction, real-time Gemini conversations, document analysis, study & coding workspaces, and multilingual translation." />
    <meta property="og:title" content="Omni — Next-Generation AI Assistant" />
    <meta property="og:description" content="Omni: A futuristic, intelligent AI assistant featuring starlight sparkle explosions, hyperspace galaxy introduction, real-time Gemini conversations, document analysis, study & coding workspaces, and multilingual translation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('omni_theme') || 'dark';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
